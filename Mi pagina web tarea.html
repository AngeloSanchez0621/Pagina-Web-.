<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulario de gustos</title>
<style>
:root{--bg:#ffffff;--fg:#1f2937;--line:#9ca3af;--accent:#2e7d32;--box:#f3f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1d21;--fg:#e5e7eb;--line:#6b7280;--accent:#66bb6a;--box:#262a30}}
:root[data-theme="dark"]{--bg:#1a1d21;--fg:#e5e7eb;--line:#6b7280;--accent:#66bb6a;--box:#262a30}
body{background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px}
label.t{display:inline-block;min-width:90px;font-size:14px}
input[type=text],select{padding:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;width:220px;max-width:100%}
.row{margin-bottom:14px}
fieldset{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:10px 14px}
legend{font-size:14px;padding:0 6px}
fieldset div{margin:4px 0}
button{padding:8px 20px;border:0;border-radius:4px;background:var(--box);color:var(--fg);cursor:pointer;margin-right:8px;font-weight:600}
button[type=submit]{background:var(--accent);color:#fff}
#res{margin-top:16px;padding:12px;background:var(--box);border-radius:6px;display:none;font-size:14px}
</style>
</head>
<body>
<form id="f">
  <div class="row"><label class="t" for="nombres">NOMBRES</label><input type="text" id="nombres" name="nombres" required></div>
  <div class="row"><label class="t" for="apellidos">APELLIDOS</label><input type="text" id="apellidos" name="apellidos" required></div>
  <div class="row"><label class="t" for="ciudad">¿DE QUÉ CIUDAD ERES?</label>
    <select id="ciudad" name="ciudad" required>
      <option value="">-- Seleccione --</option>
      <option>Baba</option><option>Vinces</option><option>Ventanas</option>
      <option>Montalvo</option><option>Jujan</option><option>Puerta Negra</option>
    </select></div>
  <fieldset>
    <legend>¿QUÉ TIPO DE MÚSICA TE GUSTA MÁS?</legend>
    <div><input type="radio" id="m1" name="musica" value="Pasillo" required><label for="m1"> PASILLO</label></div>
    <div><input type="radio" id="m2" name="musica" value="Tecnocumbia"><label for="m2"> TECNOCUMBIA</label></div>
    <div><input type="radio" id="m3" name="musica" value="Sanjuanito"><label for="m3"> SANJUANITO</label></div>
    <div><input type="radio" id="m4" name="musica" value="Bomba del Chota"><label for="m4"> BOMBA DEL CHOTA</label></div>
    <div><input type="radio" id="m5" name="musica" value="Albazo"><label for="m5"> ALBAZO</label></div>
    <div><input type="radio" id="m6" name="musica" value="Rockola"><label for="m6"> ROCKOLA</label></div>
  </fieldset>
  <fieldset>
    <legend>SI TE GUSTAN LOS HELADOS, ¿QUÉ COMBINACIÓN DE SABOR PREFIERES?</legend>
    <div><input type="checkbox" id="h1" name="helado" value="Taxo"><label for="h1"> TAXO</label></div>
    <div><input type="checkbox" id="h2" name="helado" value="Naranjilla"><label for="h2"> NARANJILLA</label></div>
    <div><input type="checkbox" id="h3" name="helado" value="Mora"><label for="h3"> MORA</label></div>
    <div><input type="checkbox" id="h4" name="helado" value="Guanábana"><label for="h4"> GUANÁBANA</label></div>
    <div><input type="checkbox" id="h5" name="helado" value="Maracuyá"><label for="h5"> MARACUYÁ</label></div>
  </fieldset>
  <button type="submit">ENVIAR</button><button type="reset" id="reset">LIMPIAR</button>
  <div id="res"></div>
</form>
<script>
var f=document.getElementById('f'),r=document.getElementById('res');
f.addEventListener('submit',function(e){
  e.preventDefault();
  var d=new FormData(f),h=d.getAll('helado');
  r.style.display='block';
  r.textContent='Registrado: '+d.get('nombres')+' '+d.get('apellidos')+' | Ciudad: '+d.get('ciudad')+' | Música: '+d.get('musica')+' | Helado: '+(h.length?h.join(', '):'ninguno');
});
f.addEventListener('reset',function(){r.style.display='none'});
</script>
</body>
</html>
